<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#05070e"/></linearGradient><linearGradient id="accentCyan" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient><linearGradient id="glowGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".25"/><stop offset="100%" stop-color="#818cf8" stop-opacity="0"/></linearGradient><linearGradient id="nodeGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".3" stroke-width=".75" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity=".4"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="softGlow" width="200%" height="200%" x="-50%" y="-50%"><feGaussianBlur stdDeviation="25"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.25;transform:scale(1)}50%{opacity:.55;transform:scale(1.08)}}@keyframes flowLine{0%{stroke-dashoffset:120}}@keyframes floatParticle{0%{transform:translateY(0) scale(1);opacity:.4}50%{transform:translateY(-12px) scale(1.3);opacity:.9}}@keyframes orbitNode{0%{transform:rotate(0deg) translateX(30px) rotate(0deg)}}.pulsing-orb{transform-origin:center;animation:pulseGlow 6s ease-in-out infinite alternate}.flow-data{stroke-dasharray:8 12;animation:flowLine 3s linear infinite}.particle-1{animation:floatParticle 4s ease-in-out infinite;transform-origin:center}.particle-2,.particle-3{animation:floatParticle 5s ease-in-out infinite 1.5s;transform-origin:center}.particle-3{animation:floatParticle 4.5s ease-in-out infinite .8s}.badge-label,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:46px;letter-spacing:-.5px;fill:#fff}.subtitle-text{font-weight:400;font-size:20px;fill:#94a3b8}.badge-label{font-weight:600;font-size:13px;fill:#38bdf8}</style><rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/><circle cx="200" cy="100" r="140" fill="#0284c7" class="pulsing-orb" filter="url(#softGlow)"/><circle cx="1020" cy="220" r="160" fill="#7c3aed" class="pulsing-orb" filter="url(#softGlow)" style="animation-delay:-3s"/><circle cx="600" cy="350" r="120" fill="#0d9488" class="pulsing-orb" filter="url(#softGlow)" style="animation-delay:-1.5s"/><rect width="1200" height="420" fill="url(#grid)" rx="16"/><g opacity=".6"><path fill="none" stroke="#334155" stroke-width="2" d="M 80 340 C 350 340, 450 160, 720 160 S 980 300, 1120 220"/><path fill="none" stroke="url(#accentCyan)" stroke-width="3" d="M 80 340 C 350 340, 450 160, 720 160 S 980 300, 1120 220" class="flow-data"/><path fill="none" stroke="#1e293b" stroke-width="2" d="M 120 180 C 320 260, 560 360, 840 280 S 1040 100, 1140 120"/><path fill="none" stroke="#38bdf8" stroke-width="2.5" d="M 120 180 C 320 260, 560 360, 840 280 S 1040 100, 1140 120" class="flow-data" style="animation-direction:reverse;animation-duration:4.5s"/><circle cx="360" cy="250" r="5" fill="#38bdf8" class="particle-1" filter="url(#glow)"/><circle cx="580" cy="215" r="4" fill="#818cf8" class="particle-2" filter="url(#glow)"/><circle cx="890" cy="240" r="6" fill="#06b6d4" class="particle-3" filter="url(#glow)"/><circle cx="1030" cy="180" r="4.5" fill="#c084fc" class="particle-1" filter="url(#glow)"/></g><g transform="translate(80, 52)"><rect width="280" height="32" fill="