<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#05070e" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity="0.4" />
    </pattern>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="25" />
    </filter>
  </defs>

  <style>
    /* Keyframe Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(1.08); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 120; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) scale(1); opacity: 0.4; }
      50% { transform: translateY(-12px) scale(1.3); opacity: 0.9; }
    }
    @keyframes orbitNode {
      0% { transform: rotate(0deg) translateX(30px) rotate(0deg); }
      100% { transform: rotate(360deg) translateX(30px) rotate(-360deg); }
    }

    .pulsing-orb {
      transform-origin: center;
      animation: pulseGlow 6s ease-in-out infinite alternate;
    }
    .flow-data {
      stroke-dasharray: 8 12;
      animation: flowLine 3s linear infinite;
    }
    .particle-1 { animation: floatParticle 4s ease-in-out infinite; transform-origin: center; }
    .particle-2 { animation: floatParticle 5s ease-in-out infinite 1.5s; transform-origin: center; }
    .particle-3 { animation: floatParticle 4.5s ease-in-out infinite 0.8s; transform-origin: center; }

    /* Static Foreground Typography */
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Orbs in Background -->
  <circle cx="200" cy="100" r="140" fill="#0284c7" filter="url(#softGlow)" class="pulsing-orb" />
  <circle cx="1020" cy="220" r="160" fill="#7c3aed" filter="url(#softGlow)" class="pulsing-orb" style="animation-delay: -3s;" />
  <circle cx="600" cy="350" r="120" fill="#0d9488" filter="url(#softGlow)" class="pulsing-orb" style="animation-delay: -1.5s;" />

  <!-- Subtle Grid Overlay -->
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Dynamic Data Pipeline Flow Lines (Behind Foreground Content) -->
  <g opacity="0.6">
    <!-- Curved flow from on-prem to cloud -->
    <path d="M 80 340 C 350 340, 450 160, 720 160 S 980 300, 1120 220" fill="none" stroke="#334155" stroke-width="2" />
    <path d="M 80 340 C 350 340, 450 160, 720 160 S 980 300, 1120 220" fill="none" stroke="url(#accentCyan)" stroke-width="3" class="flow-data" />

    <path d="M 120 180 C 320 260, 560 360, 840 280 S 1040 100, 1140 120" fill="none" stroke="#1e293b" stroke-width="2" />
    <path d="M 120 180 C 320 260, 560 360, 840 280 S 1040 100, 1140 120" fill="none" stroke="#38bdf8" stroke-width="2.5" class="flow-data" style="animation-direction: reverse; animation-duration: 4.5s;" />

    <!-- Animated Data Stream Particles -->
    <circle cx="360" cy="250" r="5" fill="#38bdf8" filter="url(#glow)" class="particle-1" />
    <circle cx="580" cy="215" r="4" fill="#818cf8" filter="url(#glow)" class="particle-2" />
    <circle cx="890" cy="240" r="6" fill="#06b6d4" filter="url(#glow)" class="particle-3" />
    <circle cx="1030" cy="180" r="4.5" fill="#c084fc" filter="url(#glow)" class="particle-1" />
  </g>

  <!-- Foreground Category Badge -->
  <g transform="translate(80, 52)">
    <rect width="280" height="32" rx="16" fill="#0369a1" fill-opacity="0.25" stroke="#0284c7" stroke-width="1.2" />
    <circle cx="16" cy="16" r="5" fill="#38bdf8" filter="url(#glow)" />
    <text x="32" y="21" class="badge-label">ENTERPRISE CLOUD ECOSYSTEM</text>
  </g>

  <!-- Foreground Title and Subtitle -->
  <!-- Title with Gradient Accent -->
  <text x="80" y="142" class="title-text">
    Cloud Data Migration <tspan fill="url(#accentCyan)">&amp; Seeding</tspan>
  </text>

  <!-- Subtitle -->
  <text x="80" y="190" class="subtitle-text">
    Curated SaaS Platforms, Resilient Open-Source Pipelines &amp; Workload Transfer Tools
  </text>

  <!-- Feature / Topic Badges in Foreground -->
  <g transform="translate(80, 240)">
    <!-- Pill 1: Workload Migration -->
    <g transform="translate(0, 0)">
      <rect width="190" height="42" rx="8" fill="url(#nodeGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="22" cy="21" r="5" fill="#38bdf8" />
      <text x="38" y="26" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">Workload Migration</text>
    </g>

    <!-- Pill 2: Database Seeding -->
    <g transform="translate(205, 0)">
      <rect width="180" height="42" rx="8" fill="url(#nodeGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="22" cy="21" r="5" fill="#a855f7" />
      <text x="38" y="26" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">Database Seeding</text>
    </g>

    <!-- Pill 3: Change Data Capture -->
    <g transform="translate(400, 0)">
      <rect width="150" height="42" rx="8" fill="url(#nodeGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="22" cy="21" r="5" fill="#10b981" />
      <text x="38" y="26" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">CDC &amp; Sync</text>
    </g>

    <!-- Pill 4: Zero-Downtime Cutover -->
    <g transform="translate(565, 0)">
      <rect width="210" height="42" rx="8" fill="url(#nodeGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="22" cy="21" r="5" fill="#f59e0b" />
      <text x="38" y="26" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">Zero-Downtime Cutover</text>
    </g>

    <!-- Pill 5: Schema Versioning -->
    <g transform="translate(790, 0)">
      <rect width="190" height="42" rx="8" fill="url(#nodeGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="22" cy="21" r="5" fill="#ec4899" />
      <text x="38" y="26" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">Schema Versioning</text>
    </g>
  </g>

  <!-- Bottom Metric Card Highlights -->
  <g transform="translate(80, 315)">
    <rect width="1040" height="60" rx="10" fill="#0b1120" fill-opacity="0.8" stroke="#1e293b" stroke-width="1" />
    
    <!-- Item 1 -->
    <text x="30" y="36" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">100%</text>
    <text x="75" y="36" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Transparent Pricing</text>
    <line x1="225" y1="18" x2="225" y2="44" stroke="#334155" stroke-width="1" />

    <!-- Item 2 -->
    <text x="255" y="36" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#a855f7">SaaS &amp; OSS</text>
    <text x="345" y="36" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Dual Ecosystem Tracking</text>
    <line x1="535" y1="18" x2="535" y2="44" stroke="#334155" stroke-width="1" />

    <!-- Item 3 -->
    <text x="565" y="36" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#10b981">Free Limits</text>
    <text x="645" y="36" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Documented Trial &amp; Free Tiers</text>
    <line x1="865" y1="18" x2="865" y2="44" stroke="#334155" stroke-width="1" />

    <!-- Item 4 -->
    <text x="895" y="36" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#f59e0b">Cloud Native</text>
    <text x="985" y="36" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Multi-Cloud Ready</text>
  </g>
</svg>